<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parking Audit Lot</title>
<style>
@font-face{font-family:"GText";src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:"GText";src:url(fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:"GSerif";src:url(fonts/SourceSerif4.woff2);font-weight:200 900}
@font-face{font-family:"GSign";src:url(fonts/Overpass.woff2);font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;-webkit-font-smoothing:antialiased;background:#6E7F50}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px}
.mask{display:block;clip-path:inset(-6px -40px -14px -40px)}
.mask > span{display:inline-block}
#bug{position:absolute;left:64px;top:46px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4)}
#bug .eyebrow{font:600 17px/22px GText;letter-spacing:.16em;white-space:nowrap}
#bug .title{margin-top:6px;font:600 44px/50px GSerif;white-space:nowrap}
#src{position:absolute;right:64px;top:52px;text-align:right;color:#fff;font:500 18px/25px GText;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#src b{font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <canvas id="world" width="3840" height="2160"></canvas>
  <div id="bug"><div class="eyebrow mask"><span>MIAMI-DADE COUNTY · COUNTYWIDE AUDIT</span></div><div class="title mask"><span>Disabled Parking Permit Investigation</span></div></div>
  <div id="src"><div class="mask"><span><b>Source:</b> Miami-Dade County Tax Collector, October 20, 2026.</span></div><div class="mask"><span>Each space = 100 applications, rounded to the nearest whole space.</span></div></div>
</div>
<script>
/* ================================================================
   DATA — every number on screen comes from here.
   Source: Miami-Dade County Tax Collector, October 20, 2026.
   ================================================================ */
const STATS = [
  { value:"137,016", n:137016, label:["APPLICATIONS REVIEWED"],                        paint:[236,235,230], key:"EACH SPACE = 100 APPLICATIONS" },
  { value:"8,517",   n:8517,   label:["FAILED FINAL AUDIT"],                           paint:[236,184,40] },
  { value:"6,169",   n:6169,   label:["PERMITS CANCELED"],                             paint:[212,64,48] },
  { value:"670",     n:670,    label:["SUSPECTED FRAUD CASES","REFERRED TO SHERIFF"],   paint:[214,172,74] },
];
const PER_SPACE=100, SPACES=STATS.map(s=>Math.round(s.n/PER_SPACE));   // 1370, 85, 62, 7
const DURATION=7;

/* ---------------- easing / helpers ---------------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function spring(z=0.82,w=10){ const wd=w*Math.sqrt(1-z*z); const raw=x=>1-Math.exp(-z*w*x)*(Math.cos(wd*x)+(z*w/wd)*Math.sin(wd*x)); const e=raw(1); return x=>x<=0?0:x>=1?1:raw(x)/e; }
function bezier(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=s=>((ax*s+bx)*s+cx)*s,Y=s=>((ay*s+by)*s+cy)*s,dX=s=>(3*ax*s+2*bx)*s+cx;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let s=x; for(let i=0;i<8;i++){const e=X(s)-x,d=dX(s); if(Math.abs(e)<1e-7||Math.abs(d)<1e-6)break; s-=e/d;}
    let lo=0,hi=1; if(Math.abs(X(s)-x)>1e-5){s=x; for(let i=0;i<40;i++){ if(X(s)<x)lo=s; else hi=s; s=(lo+hi)/2; }} return Y(s); };
}
const OUT=bezier(0.16,1,0.3,1), INOUT=bezier(0.65,0,0.35,1), POP=spring(0.55,12), PAINT=bezier(0.45,0,0.55,1);
const seg=(t,t0,d,e)=>e(clamp((t-t0)/d));
const lerp=(a,b,p)=>a+(b-a)*p;
const mix=(a,b,p)=>a.map((v,i)=>v+(b[i]-v)*p);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------------- timeline — paced to the VO ---------------- */
const T={ heroIn:-10, heroDur:2.4, paint:[0.25,1.7,3.0,4.2], paintDur:0.75,
  ticket:1.3, ticketWave:1.0, leave:2.5, leaveSpread:0.8, pins:4.0, pinSpread:0.8, bug:0.1, src:5.0 };

/* ================================================================
   THE LOT — real-world metres. x across, y into the lot, z up.
   ================================================================ */
const VMAX=9, ACC=3;
const SW=2.7, SD=5.5, AISLE=7.2, COLS=98, ROWS=14, LAST=SPACES[0]-(ROWS-1)*COLS;   // 13 x 98 + 96 = 1370
const rowY0=r=>{ const p=Math.floor(r/2); return (p+1)*AISLE + p*2*SD + (r%2)*SD; };
const aisleOf=r=> r%2===0 ? Math.floor(r/2) : Math.floor(r/2)+1;
const aisleY=a=> a*(AISLE+2*SD)+AISLE/2;
const LOT_W=COLS*SW, LOT_D=rowY0(ROWS-1)+SD+AISLE;
const APRON_Y0=-60;
const PALETTE=[[232,232,228],[232,232,228],[40,42,46],[40,42,46],[96,100,106],[178,182,187],[178,182,187],[46,64,96],[132,42,40],[198,186,160],[80,106,142],[62,70,60]];
const stalls=[];
(function(){ const r=rng(42);
  for(let row=0;row<ROWS;row++){ const n=row===ROWS-1?LAST:COLS;
    for(let c=0;c<n;c++) stalls.push({row,c, x:(c+0.5)*SW, y:rowY0(row)+SD/2, h: row%2===0?0:Math.PI, aisle:aisleOf(row),
      color:PALETTE[Math.floor(r()*PALETTE.length)], suv:r()<0.3, jx:(r()-0.5)*0.25, jh:(r()-0.5)*0.04 }); }
})();
const HERO=stalls.findIndex(s=>s.row===0&&s.c===11);
const pick=(pool,n,seed)=>{ const r=rng(seed),a=pool.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); };
const FLAGGED=pick(stalls.map((_,i)=>i).filter(i=>i!==HERO),SPACES[1],7);
const CANCELED=pick(FLAGGED,SPACES[2],11);
const REFERRED=pick(FLAGGED,SPACES[3],23);
FLAGGED.forEach(i=>{ const s=stalls[i]; s.flag=true; s.flagT=T.ticket+T.ticketWave*(s.x/LOT_W)+0.08*(s.row%3); });
// canceled cars back out and leave by the nearer end of their aisle; nearer cars go first so nobody catches up
CANCELED.forEach(i=>{ const s=stalls[i]; s.cancel=true; s.dir = s.x < LOT_W/2 ? -1 : 1; s.toEnd = s.dir<0 ? s.x : LOT_W-s.x; });
CANCELED.forEach(i=>{ const s=stalls[i]; s.leaveT = T.leave + T.leaveSpread*(s.toEnd/(LOT_W/2)); });
// keep a car length between cars sharing an aisle: a car waits until the one ahead has pulled clear
(function(){ const groups={}; CANCELED.forEach(i=>{ const s=stalls[i], k=s.aisle+':'+s.dir; (groups[k]=groups[k]||[]).push(s); });
  const GAP=6.5, back=0.95, travel=d=> d<=VMAX*VMAX/(2*ACC) ? Math.sqrt(2*d/ACC) : VMAX/ACC + (d-VMAX*VMAX/(2*ACC))/VMAX;
  for(const g of Object.values(groups)){ g.sort((a,b)=>a.toEnd-b.toEnd);
    // nobody starts before a car ahead of them in the same lane; close neighbours wait until it has pulled clear
    for(let k=1;k<g.length;k++) for(let j=0;j<k;j++){ const dx=Math.abs(g[k].toEnd-g[j].toEnd); g[k].leaveT=Math.max(g[k].leaveT, g[j].leaveT + (dx<GAP ? back+travel(GAP-dx)+0.15 : 0)); } } })();
REFERRED.slice().sort((a,b)=>stalls[a].x-stalls[b].x).forEach((i,k)=>{ const s=stalls[i]; s.refer=true; s.pinT=T.pins+T.pinSpread*k/(SPACES[3]-1); });

/* where a departing car is at time t (null once it is well away) */
function departPose(s,t){
  const u=t-s.leaveT; if(u<0) return null;
  const ay=aisleY(s.aisle), back=0.95;
  const exitH = s.dir>0 ? Math.PI/2 : -Math.PI/2;           // heading +x or -x
  if(u<back){ const p=INOUT(u/back);
    // reverse out to the aisle centre, swinging the nose toward the exit
    const turn = (s.h===0 ? 1 : -1) * (s.dir>0 ? 1 : -1);
    let h=s.h; let target = exitH; let dh=((target-h+Math.PI*3)%(Math.PI*2))-Math.PI;
    return { x:s.x + s.dir*1.2*p, y:lerp(s.y,ay,p), h:h+dh*p };
  }
  const v=u-back, d = v<VMAX/ACC ? 0.5*ACC*v*v : (VMAX*VMAX)/(2*ACC) + VMAX*(v-VMAX/ACC);
  const x0=s.x+s.dir*1.2, aisleLen = s.dir>0 ? (LOT_W+6)-x0 : x0+6;
  if(d<aisleLen) return { x:x0+s.dir*d, y:ay, h:exitH };
  // turn onto the perimeter road and head out past the front of the lot
  const R=4, arc=Math.PI/2*R, e=d-aisleLen;
  const cx= s.dir>0 ? LOT_W+6 : -6;
  if(e<arc){ const a=e/R; return { x:cx+s.dir*R*Math.sin(a), y:ay-R*(1-Math.cos(a)), h:exitH + (s.dir>0?1:-1)*a }; }
  const y=ay-R-(e-arc); if(y<-260) return null;
  return { x:cx+s.dir*R, y, h:Math.PI };
}

/* ================================================================
   CAMERA — one continuous drone move (time-aware Catmull-Rom through keys)
   [t, x, y, z, yaw°, pitch°, focal]
   ================================================================ */
const KEYS=[
  [0.0,   94,  -50,  27,    -4, 33, 1000],   // on 137,016, the lot behind
  [2.4,  140,  -56,  31,     4, 35, 1000],   // drifting right onto 8,517
  [4.4,  138,  -82,  44,     0, 44,  960],   // easing back for the near row
  [5.6, 132.5, -90,  50,     0, 45,  900],   // final: all four figures, the lot behind
  [7.0, 132.5, -92,  51,     0, 45,  900],
];
/* the opening car comes along the front aisle and turns into its space */
function heroPose(t){
  const s=stalls[HERO], R=4.5, ay=aisleY(0), cx=s.x-R, cy=ay+R;
  const L1=22, L2=Math.PI/2*R, L3=s.y-cy, total=L1+L2+L3;
  const d=total*seg(t,T.heroIn,T.heroDur,bezier(0.2,0.45,0.25,1));
  if(d<L1) return {x:cx-L1+d, y:ay, h:Math.PI/2};
  if(d<L1+L2){ const ph=(d-L1)/R; return {x:cx+R*Math.sin(ph), y:cy-R*Math.cos(ph), h:Math.PI/2-ph}; }
  return {x:s.x, y:cy+(d-L1-L2), h:0};
}
function camAt(t){
  const K=KEYS; let i=0; while(i<K.length-2 && t>K[i+1][0]) i++;
  const k0=K[Math.max(0,i-1)], k1=K[i], k2=K[i+1], k3=K[Math.min(K.length-1,i+2)];
  const h=k2[0]-k1[0], s=clamp((t-k1[0])/h);
  const tan=(a,b,c,j)=> (a===b||b===c) ? 0 : (c[j]-a[j])/(c[0]-a[0]);
  const out=[];
  for(let j=1;j<7;j++){
    const m1 = (i===0) ? 0 : (k2[j]-k0[j])/(k2[0]-k0[0]);
    const m2 = (i+1===K.length-1) ? 0 : (k3[j]-k1[j])/(k3[0]-k1[0]);
    const s2=s*s, s3=s2*s;
    out.push((2*s3-3*s2+1)*k1[j] + (s3-2*s2+s)*h*m1 + (-2*s3+3*s2)*k2[j] + (s3-s2)*h*m2);
  }
  const [x,y,z,yawD,pitchD,f]=out, yaw=yawD*Math.PI/180, pit=pitchD*Math.PI/180;
  const fw=[Math.sin(yaw)*Math.cos(pit), Math.cos(yaw)*Math.cos(pit), -Math.sin(pit)];
  const rt=[Math.cos(yaw), -Math.sin(yaw), 0];
  const up=[Math.sin(yaw)*Math.sin(pit), Math.cos(yaw)*Math.sin(pit), Math.cos(pit)];
  return {x,y,z,f,fw,rt,up,yaw,pit};
}
let CAM=null;
const NEAR=0.6;
function toCam(p){ const dx=p[0]-CAM.x, dy=p[1]-CAM.y, dz=(p[2]||0)-CAM.z;
  return [dx*CAM.rt[0]+dy*CAM.rt[1], dx*CAM.up[0]+dy*CAM.up[1]+dz*CAM.up[2], dx*CAM.fw[0]+dy*CAM.fw[1]+dz*CAM.fw[2]]; }
const scr=c=>[960+CAM.f*c[0]/c[2], 540-CAM.f*c[1]/c[2]];
function clipNear(pts){ const out=[]; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length];
    const ain=a[2]>NEAR, bin=b[2]>NEAR; if(ain) out.push(a);
    if(ain!==bin){ const k=(NEAR-a[2])/(b[2]-a[2]); out.push([a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, NEAR]); } } return out; }
const g=document.getElementById('world').getContext('2d');
function poly(pts3, fill){
  const c=clipNear(pts3.map(toCam)); if(c.length<3) return false;
  const s=c.map(scr);
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9; for(const p of s){ minx=Math.min(minx,p[0]); maxx=Math.max(maxx,p[0]); miny=Math.min(miny,p[1]); maxy=Math.max(maxy,p[1]); }
  if(maxx<-50||minx>1970||maxy<-50||miny>1130) return false;
  g.fillStyle=fill; g.beginPath(); g.moveTo(s[0][0],s[0][1]); for(let i=1;i<s.length;i++) g.lineTo(s[i][0],s[i][1]); g.closePath(); g.fill(); return true;
}
const rect=(x0,y0,x1,y1,z=0)=>[[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]];
const ringPts=(cx,cy,r,n=28,z=0)=>Array.from({length:n},(_,i)=>[cx+r*Math.cos(i/n*Math.PI*2), cy+r*Math.sin(i/n*Math.PI*2), z]);

/* ---------------- painted figures on the apron (textures, laid onto the ground) ---------------- */
const PPM=20, STW=64, STH=26;                      // stencil size in metres
const ST_POS=[[99,-18],[166,-18],[99,-46],[166,-46]];     // 2 x 2 block, read left-right, far row first
function makeStencil(st){
  const cv=document.createElement('canvas'); cv.width=STW*PPM; cv.height=STH*PPM; const c=cv.getContext('2d');
  c.fillStyle=rgb(st.paint); c.textAlign='center'; c.textBaseline='alphabetic';
  const fit=(txt,px,maxW)=>{ let s=px; c.font=`800 ${s}px GSign`; while(c.measureText(txt).width>maxW && s>10){ s-=2; c.font=`800 ${s}px GSign`; } };
  fit(st.value,270,cv.width-60); c.fillText(st.value,cv.width/2,232);
  st.label.forEach((l,i)=>{ fit(l,92,cv.width-60); c.fillText(l,cv.width/2,342+i*104); });
  if(st.key){ fit(st.key,56,cv.width-120); c.fillText(st.key,cv.width/2,452); }
  // worn paint: the asphalt shows through in places
  const r=rng(st.n); c.globalCompositeOperation='destination-out';
  for(let i=0;i<5200;i++){ c.fillStyle=`rgba(0,0,0,${0.35+r()*0.55})`; c.fillRect(r()*cv.width, r()*cv.height, 1+r()*3.5, 1+r()*2.5); }
  c.globalCompositeOperation='source-over';
  return cv;
}
let STENCILS=[], REVEAL=null;
function drawTexOnGround(tex, x0, yTop, wM, hM, reveal=1, nu=16, nv=6){
  const W=tex.width, H=tex.height;
  for(let j=0;j<nv;j++) for(let i=0;i<nu;i++){
    const v0=H*j/nv, v1=H*(j+1)/nv, umax=W*(typeof reveal==='function' ? reveal(v0) : reveal);
    const u0=W*i/nu; if(u0>=umax) continue; const u1=Math.min(W*(i+1)/nu, umax);
    const P=(u,v)=>{ const c=toCam([x0+u/W*wM, yTop-v/H*hM, 0.01]); return c; };
    const A=P(u0,v0),B=P(u1,v0),C=P(u1,v1),D=P(u0,v1);
    if(A[2]<NEAR||B[2]<NEAR||C[2]<NEAR||D[2]<NEAR) continue;
    const a=scr(A),b=scr(B),cc=scr(C),d=scr(D);
    const mnx=Math.min(a[0],b[0],cc[0],d[0]), mxx=Math.max(a[0],b[0],cc[0],d[0]), mny=Math.min(a[1],b[1],cc[1],d[1]), mxy=Math.max(a[1],b[1],cc[1],d[1]);
    if(mxx<0||mnx>1920||mxy<0||mny>1080) continue;
    for(const [t0,t1,t2,s0,s1,s2] of [[[u0,v0],[u1,v0],[u1,v1],a,b,cc],[[u0,v0],[u1,v1],[u0,v1],a,cc,d]]){
      const den=(t1[0]-t0[0])*(t2[1]-t0[1])-(t2[0]-t0[0])*(t1[1]-t0[1]); if(Math.abs(den)<1e-9) continue;
      const ma=((s1[0]-s0[0])*(t2[1]-t0[1])-(s2[0]-s0[0])*(t1[1]-t0[1]))/den, mc=((s2[0]-s0[0])*(t1[0]-t0[0])-(s1[0]-s0[0])*(t2[0]-t0[0]))/den;
      const mb=((s1[1]-s0[1])*(t2[1]-t0[1])-(s2[1]-s0[1])*(t1[1]-t0[1]))/den, md=((s2[1]-s0[1])*(t1[0]-t0[0])-(s1[1]-s0[1])*(t2[0]-t0[0]))/den;
      const me=s0[0]-ma*t0[0]-mc*t0[1], mf=s0[1]-mb*t0[0]-md*t0[1];
      const cxm=(s0[0]+s1[0]+s2[0])/3, cym=(s0[1]+s1[1]+s2[1])/3, grow=p=>{ const dx=p[0]-cxm, dy=p[1]-cym, l=Math.hypot(dx,dy)||1; return [p[0]+dx/l*0.7, p[1]+dy/l*0.7]; };
      const q0=grow(s0),q1=grow(s1),q2=grow(s2);
      g.save(); g.beginPath(); g.moveTo(q0[0],q0[1]); g.lineTo(q1[0],q1[1]); g.lineTo(q2[0],q2[1]); g.closePath(); g.clip();
      g.transform(ma,mb,mc,md,me,mf); g.drawImage(tex, u0, v0, u1-u0, v1-v0, u0, v0, u1-u0, v1-v0); g.restore();
    }
  }
}
let ISA=null;
function makeISA(){ const cv=document.createElement('canvas'); cv.width=cv.height=120; const c=cv.getContext('2d');
  c.fillStyle='#2F6BC1'; c.fillRect(0,0,120,120); c.save(); c.translate(60,60); const k=1.7;
  c.fillStyle='#ECEBE6'; c.strokeStyle='#ECEBE6'; c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.arc(-6*k,-19*k,4.6*k,0,Math.PI*2); c.fill();
  c.lineWidth=5*k; c.beginPath(); c.moveTo(-8*k,-10*k); c.lineTo(-5*k,6*k); c.lineTo(9*k,6*k); c.lineTo(15*k,20*k); c.stroke();
  c.lineWidth=4*k; c.beginPath(); c.moveTo(-7*k,-3*k); c.lineTo(6*k,-4*k); c.stroke();
  c.lineWidth=3.6*k; c.beginPath(); c.arc(-6*k,11*k,13*k,-0.25*Math.PI,1.18*Math.PI); c.stroke(); c.restore(); return cv; }

/* ---------------- scenery ---------------- */
const TREES=[], POLES=[], CLOUDS=[];
(function(){ const r=rng(9);
  for(let p=0;p<7;p++){ const y=rowY0(p*2)+SD; TREES.push([-4.2,y,3.2+r()*0.8]); TREES.push([LOT_W+4.2,y,3.2+r()*0.8]); POLES.push([-4.2,y-3.8]); POLES.push([LOT_W+4.2,y+3.8]); }
  for(let x=-30;x<=LOT_W+30;x+=13+r()*5) TREES.push([x, LOT_D+9+r()*3, 3.4+r()*1.4]);
  for(let x=-30;x<=LOT_W+30;x+=14+r()*6) if(x<60||x>205) TREES.push([x, APRON_Y0-7-r()*3, 3.2+r()*1.4]);
  for(let y=-50;y<=LOT_D;y+=15+r()*6){ TREES.push([-24-r()*4,y,3.4+r()*1.2]); TREES.push([LOT_W+24+r()*4,y,3.4+r()*1.2]); }
  for(let x=20;x<LOT_W;x+=60) POLES.push([x,-30]);
  for(let i=0;i<4;i++) CLOUDS.push([r()*400-100, r()*260-80, 34+r()*30]);
})();
const SUN=[-0.42,-0.55,0.72];   // toward the sun
const shadeK=n=>0.66+0.34*Math.max(0,n[0]*SUN[0]+n[1]*SUN[1]+n[2]*SUN[2]);
const SHX=-SUN[0]/SUN[2], SHY=-SUN[1]/SUN[2];

function drawGround(t){
  poly(rect(-900,-900,1200,1200),'#6E7F50');
  poly(rect(-20,APRON_Y0-2,LOT_W+20,LOT_D+2),'#D8D4C8');                               // curb/sidewalk
  poly(rect(-18,APRON_Y0,LOT_W+18,LOT_D),'#46484B');                                   // asphalt
  for(const x of [-14,LOT_W+4]) poly(rect(x,-400,x+10,LOT_D+3),'#3E4043');            // perimeter roads
  poly(rect(0,APRON_Y0+1.5,LOT_W,-1.5),'#4A4C4F');                                      // apron (slightly fresher)
  poly(rect(0,-1.5,LOT_W,-1.2),'#ECEBE6');                                              // stop bar between apron and lot
  // islands at row ends + the unused end of the last row
  for(let p=0;p<7;p++){ const y0=rowY0(p*2), y1=y0+2*SD; for(const x of [-6.6,LOT_W+1.8]){ poly(rect(x,y0+0.3,x+4.8,y1-0.3),'#D8D4C8'); poly(rect(x+0.5,y0+0.8,x+4.3,y1-0.8),'#6F8250'); } }
  { const y0=rowY0(ROWS-1); poly(rect(LAST*SW+0.4,y0+0.3,LOT_W-0.4,y0+SD-0.3),'#D8D4C8'); poly(rect(LAST*SW+0.9,y0+0.8,LOT_W-0.9,y0+SD-0.8),'#6F8250'); }
  // stall paint (blue, muted once the audit wave starts so the flagged spaces read)
  const m=seg(t,T.ticket-0.3,1.0,INOUT), paint=rgb(mix([52,110,198],[78,88,108],m*0.8));
  for(let row=0;row<ROWS;row++){ const y0=rowY0(row), n=row===ROWS-1?LAST:COLS, lw=0.12;
    const back = row%2===0 ? y0+SD : y0;
    poly(rect(0,back-lw/2,n*SW,back+lw/2),paint);
    for(let c=0;c<=n;c++) poly(rect(c*SW-lw/2,y0,c*SW+lw/2,y0+SD),paint);
  }
  // aisle arrows
  for(let a=0;a<8;a++) for(const x of [40,132,224]){ const y=aisleY(a); poly([[x-3,y-0.18,0],[x+2,y-0.18,0],[x+2,y-0.7,0],[x+4,y,0],[x+2,y+0.7,0],[x+2,y+0.18,0],[x-3,y+0.18,0]],'rgba(236,235,230,.55)'); }
  // flagged / voided spaces
  for(const s of stalls){
    if(!s.flag || t<s.flagT) continue;
    const gp=POP(clamp((t-s.flagT)/0.5)), hw=(SW/2-0.15)*gp, hd=(SD/2-0.15)*gp;
    const voided = s.cancel && t>s.leaveT+0.6;
    poly(rect(s.x-hw,s.y-hd,s.x+hw,s.y+hd,0.005), voided ? '#6B2A23' : '#C9981F');
  }
  // painted access symbols where a space is empty
  for(const [i,s] of stalls.entries()){
    const empty=(i===HERO && t<T.heroIn+T.heroDur) || (s.cancel && t>s.leaveT+0.6);
    if(!empty) continue;
    const yy= s.h===0 ? s.y-0.9 : s.y+0.9;
    drawTexOnGround(ISA, s.x-0.9, yy+0.9, 1.8, 1.8, 1, 1, 1);
    if(s.cancel){ const vp=seg(t,s.leaveT+0.7,0.7,OUT), a=clamp(vp*2), b=clamp(vp*2-1);
      const L=(x0,y0,x1,y1,p)=>{ const x2=x0+(x1-x0)*p, y2=y0+(y1-y0)*p, nx=-(y1-y0), ny=x1-x0, l=Math.hypot(nx,ny), w=0.11; poly([[x0+nx/l*w,y0+ny/l*w,0.01],[x2+nx/l*w,y2+ny/l*w,0.01],[x2-nx/l*w,y2-ny/l*w,0.01],[x0-nx/l*w,y0-ny/l*w,0.01]],'#D44030'); };
      if(a>0) L(s.x-1.05,s.y-2.4,s.x+1.05,s.y+2.4,a); if(b>0) L(s.x+1.05,s.y-2.4,s.x-1.05,s.y+2.4,b); }
  }
  // painted figures
  STATS.forEach((st,i)=>{ const p=seg(t,T.paint[i],T.paintDur,PAINT); if(p<=0) return;
    // the figure is striped first, then its label beneath it
    const [cx,cy]=ST_POS[i]; drawTexOnGround(STENCILS[i], cx-STW/2, cy+STH/2, STW, STH, v0=> v0<250 ? clamp(p/0.55) : clamp((p-0.45)/0.55)); });
  // gold rings painted around the referred spaces
  for(const s of stalls) if(s.refer && t>s.pinT+0.35){ const rp=seg(t,s.pinT+0.35,0.6,OUT), n=40, r0=4.4, r1=4.85, k=Math.max(2,Math.ceil(n*rp));
    const pts=[]; for(let i=0;i<=k;i++){ const a=-Math.PI/2+Math.PI*2*rp*i/k; pts.push([s.x+r1*Math.cos(a),s.y+r1*Math.sin(a),0.02]); }
    for(let i=k;i>=0;i--){ const a=-Math.PI/2+Math.PI*2*rp*i/k; pts.push([s.x+r0*Math.cos(a),s.y+r0*Math.sin(a),0.02]); }
    poly(pts,'#D9B04A'); }
}

/* ---------------- cars ---------------- */
function boxFaces(cx,cy,h,L0,L1,W0,W1,z0,z1,topScale=1){
  // a box (optionally narrower on top) in the car's frame: L along heading, W across
  const f=[Math.sin(h),Math.cos(h)], r=[Math.cos(h),-Math.sin(h)];
  const P=(l,w,z)=>[cx+f[0]*l+r[0]*w, cy+f[1]*l+r[1]*w, z];
  const lm=(L0+L1)/2, wm=(W0+W1)/2, ts=topScale;
  const b=[P(L0,W0,z0),P(L1,W0,z0),P(L1,W1,z0),P(L0,W1,z0)];
  const T=[P(lm+(L0-lm)*ts,wm+(W0-wm)*ts,z1),P(lm+(L1-lm)*ts,wm+(W0-wm)*ts,z1),P(lm+(L1-lm)*ts,wm+(W1-wm)*ts,z1),P(lm+(L0-lm)*ts,wm+(W1-wm)*ts,z1)];
  return { top:T, sides:[[b[0],b[1],T[1],T[0]],[b[1],b[2],T[2],T[1]],[b[2],b[3],T[3],T[2]],[b[3],b[0],T[0],T[3]]], f, r };
}
const nrm=(a,b,c)=>{ const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]]; const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]; const l=Math.hypot(...n)||1; return n.map(q=>q/l); };
const facing=(face,n)=>{ const c=face.reduce((a,p)=>[a[0]+p[0]/face.length,a[1]+p[1]/face.length,a[2]+p[2]/face.length],[0,0,0]); return (CAM.x-c[0])*n[0]+(CAM.y-c[1])*n[1]+(CAM.z-c[2])*n[2] > 0; };
function car(x,y,h,col,o){
  const L=4.6, Wd=1.86, depth=toCam([x,y,1])[2]; if(depth<NEAR+1) return;
  const pxLen=CAM.f*L/depth;
  if(o.mute>0) col=mix(col,[122,124,128],0.55*o.mute);
  const shade=(n,k=1)=>rgb(col.map(v=>Math.min(255,v*shadeK(n)*k)));
  if(pxLen<9){ const b=boxFaces(x,y,h,-L/2,L/2,-Wd/2,Wd/2,0.3,1.0); poly(b.top,shade([0,0,1])); return; }
  // tyres / undercarriage
  const u=boxFaces(x,y,h,-L/2+0.25,L/2-0.25,-Wd/2+0.04,Wd/2-0.04,0.0,0.42);
  for(const s of u.sides){ const n=nrm(s[0],s[1],s[2]).map(v=>-v); if(facing(s,n)) poly(s,'#1C1D1F'); }
  // body
  const hb=o.suv?1.12:0.98, b=boxFaces(x,y,h,-L/2,L/2,-Wd/2,Wd/2,0.4,hb,0.96);
  for(const s of b.sides){ const n=nrm(s[0],s[1],s[2]).map(v=>-v); if(facing(s,n)) poly(s,shade(n,0.92)); }
  poly(b.top,shade([0,0,1]));
  // cabin: glass sides, roof
  const top=o.suv?1.72:1.44, cab=boxFaces(x,y,h,o.suv?-1.75:-1.35,o.suv?1.05:0.95,-0.8,0.8,hb,top,0.82);
  const glass=o.mute>0 ? rgb(mix([34,40,48],[96,98,102],0.55*o.mute)) : '#222831';
  for(const s of cab.sides){ const n=nrm(s[0],s[1],s[2]).map(v=>-v); if(facing(s,n)) poly(s,glass); }
  poly(cab.top, o.patrol ? '#F4F4F0' : shade([0,0,1],1.05));
  if(o.patrol){ const bar=boxFaces(x,y,h,-0.35,-0.1,-0.62,0.62,top,top+0.12); const ph=Math.floor(o.t*5)%2;
    poly(boxFaces(x,y,h,-0.35,-0.1,-0.62,0,top,top+0.12).top, ph?'#E8392E':'#6B1A15'); poly(boxFaces(x,y,h,-0.35,-0.1,0,0.62,top,top+0.12).top, ph?'#163777':'#3A78FF'); }
  if(o.ticket>0){ const k=o.ticket; const tk=boxFaces(x,y,h,0.95+0.05,0.95+0.05+0.42*k,-0.2*k,0.38*k,hb+0.01,hb+0.02); poly(tk.top,'#F2C230'); }
}
function carShadow(x,y,h,hgt){
  const f=[Math.sin(h),Math.cos(h)], r=[Math.cos(h),-Math.sin(h)], L=2.35, W=0.95;
  const pts=[]; for(const [l,w] of [[-L,-W],[L,-W],[L,W],[-L,W]]){ const px=x+f[0]*l+r[0]*w, py=y+f[1]*l+r[1]*w; pts.push([px,py],[px+SHX*hgt,py+SHY*hgt]); }
  // convex hull of footprint + its cast copy
  pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],hi=[]; for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; while(hi.length>=2&&cr(hi[hi.length-2],hi[hi.length-1],p)<=0) hi.pop(); hi.push(p); }
  const hull=lo.slice(0,-1).concat(hi.slice(0,-1)); poly(hull.map(p=>[p[0],p[1],0.01]),'rgba(10,12,16,.30)');
}
function tree(x,y,r){
  const base=toCam([x,y,0]); if(base[2]<NEAR+1) return;
  const top=toCam([x,y,r*1.5]); const a=scr(base), b=scr(top);
  g.strokeStyle='#5C4A3A'; g.lineWidth=Math.max(1,CAM.f*0.35/base[2]); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
  const c=toCam([x,y,r*1.9]); if(c[2]<NEAR) return; const s=scr(c), R=CAM.f*r/c[2];
  g.fillStyle='#4C6A33'; g.beginPath(); g.arc(s[0],s[1],R,0,Math.PI*2); g.fill();
  g.fillStyle='#5E7F3E'; g.beginPath(); g.arc(s[0]-R*0.22,s[1]-R*0.25,R*0.68,0,Math.PI*2); g.fill();
}
function pole(x,y){ const a=toCam([x,y,0]), b=toCam([x,y,11]); if(a[2]<NEAR+1||b[2]<NEAR) return; const A=scr(a),B=scr(b);
  g.strokeStyle='#8A8E93'; g.lineWidth=Math.max(1,CAM.f*0.22/a[2]); g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke();
  poly(rect(x-1.1,y-0.25,x+1.1,y+0.25,11),'#55595E'); }
function pin(x,y,zb,t){                      // sheriff's badge marker standing over a referred space
  const a=toCam([x,y,zb]), b=toCam([x,y,zb+3.4]); if(a[2]<NEAR+1||b[2]<NEAR) return;
  const A=scr(a), B=scr(b), R=CAM.f*1.25/b[2];
  g.strokeStyle='#3A2F17'; g.lineWidth=Math.max(1.2,CAM.f*0.14/a[2]); g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke();
  g.fillStyle='#8C6A24'; g.beginPath(); g.arc(B[0],B[1],R*1.08,0,Math.PI*2); g.fill();
  g.fillStyle='#D9B04A'; g.beginPath(); g.arc(B[0],B[1],R,0,Math.PI*2); g.fill();
  g.fillStyle='#FFF3CF'; g.beginPath(); for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=i%2?R*0.32:R*0.72; g.lineTo(B[0]+rr*Math.cos(ang),B[1]+rr*Math.sin(ang)); } g.closePath(); g.fill();
}

function render(t){
  CAM=camAt(t);
  g.setTransform(2,0,0,2,0,0);
  const sk=g.createLinearGradient(0,0,0,1080); sk.addColorStop(0,'#9DBAD3'); sk.addColorStop(1,'#D9E0DF'); g.fillStyle=sk; g.fillRect(0,0,1920,1080);
  drawGround(t);
  // shadows
  const poses=[];
  for(const [i,s] of stalls.entries()){
    let x=s.x+s.jx, y=s.y, h=s.h+s.jh;
    if(i===HERO){ const hp=heroPose(t); x=hp.x; y=hp.y; h=hp.h; }
    if(s.cancel && t>=s.leaveT){ const d=departPose(s,t); if(!d) continue; x=d.x; y=d.y; h=d.h; }
    poses.push({i,s,x,y,h});
  }
  for(const p of poses) carShadow(p.x,p.y,p.h,p.s.suv?1.7:1.45);
  for(const [x,y,r] of TREES) poly(ringPts(x+SHX*r*1.9,y+SHY*r*1.9,r,16,0.01),'rgba(10,12,16,.25)');
  // objects, far to near
  const items=[];
  for(const p of poses) items.push({d:toCam([p.x,p.y,1])[2], fn:()=>{ const s=p.s, mute= s.flag?0:seg(t,T.ticket-0.3,1.0,INOUT); car(p.x,p.y,p.h,s.color,{suv:s.suv,mute,ticket:s.flag?POP(clamp((t-s.flagT)/0.45)):0}); }});
  for(const [x,y,r] of TREES) items.push({d:toCam([x,y,r])[2], fn:()=>tree(x,y,r)});
  for(const [x,y] of POLES) items.push({d:toCam([x,y,5])[2], fn:()=>pole(x,y)});
  for(const s of stalls) if(s.refer && t>s.pinT){ const p=clamp((t-s.pinT)/0.7), zb=lerp(26,1.6,POP(p)); items.push({d:toCam([s.x,s.y,zb+2])[2]-3, fn:()=>pin(s.x,s.y,zb,t)}); }
  items.sort((a,b)=>b.d-a.d); for(const it of items) if(it.d>NEAR) it.fn();
  // red/blue lights pulse around the referred spaces once marked
  g.save(); g.globalCompositeOperation='lighter';
  for(const s of stalls) if(s.refer && t>s.pinT+0.4){ const c=toCam([s.x,s.y,1.5]); if(c[2]<NEAR) continue; const p=scr(c), R=CAM.f*5.5/c[2], ph=Math.floor(t*4+s.c)%2;
    const gg=g.createRadialGradient(p[0],p[1],0,p[0],p[1],R); const col=ph?[232,57,46]:[47,107,255]; gg.addColorStop(0,rgb(col,0.32)); gg.addColorStop(1,rgb(col,0)); g.fillStyle=gg; g.fillRect(p[0]-R,p[1]-R,2*R,2*R); }
  g.restore();
  // drifting cloud shadows
  for(const [cx,cy,r] of CLOUDS){ const x=cx+t*2.2; for(const [k,a] of [[1,0.025],[0.8,0.025],[0.6,0.025]]) poly(ringPts(x,cy,r*k,24,0.02),`rgba(20,26,34,${a})`); }
  // overlay type
  rise(document.querySelector('#bug .eyebrow > span'),t,T.bug); rise(document.querySelector('#bug .title > span'),t,T.bug+0.12);
  document.querySelectorAll('#src .mask > span').forEach((e,i)=>rise(e,t,T.src+i*0.12));
}
function rise(el,t,t0,d=1.0){ el.style.transform=`translateY(${(1-seg(t,t0,d,OUT))*140}%)`; }

window.ready=(async()=>{
  await Promise.all([document.fonts.load('800 100px GSign'),document.fonts.load('600 44px GSerif'),document.fonts.load('600 17px GText'),document.fonts.load('500 18px GText')]);
  await document.fonts.ready;
  STENCILS=STATS.map(makeStencil); ISA=makeISA(); render(0); return true;
})();
window.render=render;
window.__data={STATS,SPACES,stalls,FLAGGED,CANCELED,REFERRED,HERO,T,DURATION,KEYS,camAt,departPose,LOT_W,LOT_D,ST_POS,STW,STH,toCam:(p)=>toCam(p),scr:(c)=>scr(c)};
const q=new URLSearchParams(location.search);
if(!q.has('capture')) window.ready.then(()=>{ if(q.has('t')){render(+q.get('t'));return;} const t0=performance.now(); const loop=n=>{render(((n-t0)/1000)%(DURATION+1)); requestAnimationFrame(loop);}; requestAnimationFrame(loop); });
</script>
</body>
