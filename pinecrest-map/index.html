<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinecrest Speed Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  /* PLACEHOLDER STYLE — colors/fonts/sign/labels get replaced once style references arrive. */
  :root {
    --accent: #ffc53d;          /* single road accent */
    --ink: #ffffff;
    --muted: #a9b1bf;
    --panel: rgba(10, 13, 19, 0.82);
    --page: #05070a;
    --font: "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; font-family: var(--font); color: var(--ink); }

  /* 1920x1080 stage, scaled to fit the window for preview; 1:1 when exporting */
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d12; transform-origin: center center; flex: none; }
  #map, #fx, #markers, #labels { position: absolute; inset: 0; }
  #fx { pointer-events: none; overflow: visible; }
  #markers, #labels { pointer-events: none; }

  /* hide every MapLibre control; attribution is drawn by us (#attrib) */
  .maplibregl-control-container { display: none !important; }

  /* ---------- title ---------- */
  #title { position: absolute; left: 132px; top: 92px; will-change: transform, opacity; }
  #title .bar { position: absolute; left: -22px; top: 6px; bottom: 6px; width: 6px; background: var(--accent); border-radius: 3px; transform-origin: top; }
  #title .kicker { font-size: 28px; font-weight: 700; letter-spacing: 0.28em; color: var(--muted); }
  #title .headline { font-size: 68px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.02; margin-top: 6px; text-shadow: 0 4px 24px rgba(0,0,0,.6); }

  /* ---------- markers ---------- */
  .marker { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .marker .ring, .marker .pulse { position: absolute; left: -36px; top: -36px; width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
  .marker .body { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; background: #0d1118; border: 4px solid var(--accent); display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.55); }
  .marker .body svg { width: 40px; height: 40px; }

  /* ---------- road labels ---------- */
  .label { position: absolute; left: 0; top: 0; padding: 12px 20px 13px 22px; background: var(--panel); border-radius: 8px; border-left: 6px solid var(--accent); white-space: nowrap; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .label .name { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
  .label .sub { font-size: 21px; font-weight: 600; color: var(--muted); margin-top: 6px; line-height: 1; }

  /* ---------- speed callout ---------- */
  #callout { position: absolute; right: 132px; bottom: 96px; display: flex; align-items: flex-end; gap: 26px; }
  #callout .meta { text-align: right; padding-bottom: 8px; }
  #callout .meta .line { font-size: 32px; font-weight: 800; letter-spacing: 0.02em; text-shadow: 0 3px 16px rgba(0,0,0,.7); }
  #sign { position: relative; width: 196px; height: 250px; background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.6); }
  #sign .inner { position: absolute; inset: 9px; border: 5px solid #111; border-radius: 10px; color: #111; text-align: center; overflow: hidden; }
  #sign .words { font-size: 33px; font-weight: 900; line-height: 1.0; margin-top: 16px; letter-spacing: 0.02em; }
  #sign .num { position: absolute; left: 0; right: 0; top: 96px; height: 116px; overflow: hidden; }
  #sign .num span { position: absolute; left: 0; right: 0; top: 0; font-size: 112px; font-weight: 900; line-height: 116px; letter-spacing: -0.03em; }
  #sign .strike { position: absolute; left: 10px; right: 10px; top: 150px; height: 12px; margin-top: -6px; background: #e5262b; border-radius: 6px; transform-origin: left center; transform: rotate(-24deg) scaleX(0); }

  /* ---------- small bits ---------- */
  #attrib { position: absolute; left: 14px; bottom: 9px; font-size: 13px; color: rgba(255,255,255,.42); letter-spacing: .02em; }
  #safe { position: absolute; inset: 5%; border: 2px dashed rgba(0,255,170,.55); display: none; pointer-events: none; }
  #safe::after { content: "90% safe area"; position: absolute; left: 8px; top: 6px; font: 600 16px var(--font); color: rgba(0,255,170,.8); }
  body.guides #safe { display: block; }

  #ui { position: fixed; right: 18px; bottom: 18px; display: flex; gap: 10px; align-items: center; font: 600 13px var(--font); color: #cfd5df; transition: opacity .4s; z-index: 10; }
  #ui button { font: 700 14px var(--font); background: #1b2230; color: #fff; border: 1px solid #2c3546; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
  #ui button:hover { background: #253046; }
  #ui .time { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; opacity: .8; }
  #ui .keys { opacity: .55; }
  body.idle #ui { opacity: 0; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px var(--font); color: #9aa3b2; background: var(--page); z-index: 20; transition: opacity .5s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #notice { position: fixed; left: 18px; bottom: 18px; max-width: 560px; font: 500 13px/1.4 var(--font); color: #ffb4a8; z-index: 10; }

  /* export / recording mode */
  body.export #ui, body.export #loading, body.export #notice { display: none !important; }
  body.alpha, body.alpha #stage { background: transparent !important; }
  body.alpha #map, body.alpha #attrib { visibility: hidden; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="map"></div>
    <svg id="fx" width="1920" height="1080" viewBox="0 0 1920 1080">
      <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <g id="boundaryLayer"></g>
      <g id="roadLayer"></g>
      <g id="leaderLayer"></g>
    </svg>
    <div id="markers"></div>
    <div id="labels"></div>
    <div id="title">
      <div class="bar"></div>
      <div class="kicker">PINECREST</div>
      <div class="headline">SPEED LIMIT CHANGES</div>
    </div>
    <div id="callout">
      <div class="meta"><div class="line">MPH &bull; Effective Aug. 17</div></div>
      <div id="sign">
        <div class="inner">
          <div class="words">SPEED<br>LIMIT</div>
          <div class="num"><span class="old">35</span><span class="new">30</span></div>
          <div class="strike"></div>
        </div>
      </div>
    </div>
    <div id="attrib">&copy; OpenStreetMap contributors &copy; CARTO</div>
    <div id="safe"></div>
  </div>
</div>

<div id="ui">
  <span class="keys">R replay &middot; Space pause &middot; &larr;/&rarr; frame &middot; G safe area &middot; H hide UI</span>
  <span class="time" id="time">0.00s</span>
  <button id="replay" type="button">&#8635; Replay</button>
</div>
<div id="loading">Loading map tiles&hellip;</div>
<div id="notice"></div>

<script src="node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<script src="node_modules/motion/dist/motion.js"></script>
<script src="app.js"></script>
</body>
</html>
