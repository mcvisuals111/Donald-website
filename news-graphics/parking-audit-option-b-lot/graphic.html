<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parking Audit Lot</title>
<style>
@font-face{font-family:"GText";src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:"GText";src:url(fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:"GSerif";src:url(fonts/SourceSerif4.woff2);font-weight:200 900}
@font-face{font-family:"GSign";src:url(fonts/Overpass.woff2);font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;-webkit-font-smoothing:antialiased;background:#6E7F50}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px}
.mask{display:block;clip-path:inset(-6px -40px -14px -40px)}
.mask > span{display:inline-block}
#bug{position:absolute;left:64px;top:46px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4)}
#bug .eyebrow{font:600 17px/22px GText;letter-spacing:.16em;white-space:nowrap}
#bug .title{margin-top:6px;font:600 44px/50px GSerif;white-space:nowrap}
#src{position:absolute;right:64px;top:52px;text-align:right;color:#fff;font:500 18px/25px GText;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#src b{font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <canvas id="world" width="3840" height="2160"></canvas>
  <div id="bug"><div class="eyebrow mask"><span>MIAMI-DADE COUNTY · COUNTYWIDE AUDIT</span></div><div class="title mask"><span>Disabled Parking Permit Investigation</span></div></div>
  <div id="src"><div class="mask"><span><b>Source:</b> Miami-Dade County Tax Collector, October 20, 2026.</span></div><div class="mask"><span>Each space = 100 applications, rounded to the nearest whole space.</span></div></div>
</div>
<script>
/* ================================================================
   DATA — every number on screen comes from here.
   Source: Miami-Dade County Tax Collector, October 20, 2026.
   ================================================================ */
const STATS = [
  { value:"137,016", n:137016, label:["APPLICATIONS REVIEWED"],                        paint:[236,235,230], key:"EACH SPACE = 100 APPLICATIONS" },
  { value:"8,517",   n:8517,   label:["FAILED FINAL AUDIT"],                           paint:[236,184,40] },
  { value:"6,169",   n:6169,   label:["PERMITS CANCELED"],                             paint:[212,64,48] },
  { value:"670",     n:670,    label:["SUSPECTED FRAUD CASES","REFERRED TO SHERIFF"],   paint:[214,172,74] },
];
const DURATION=7;
const PER_SPACE=100, SPACES=STATS.map(s=>Math.round(s.n/PER_SPACE));   // 1370, 85, 62, 7

/* ---------------- easing / helpers ---------------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function spring(z=0.82,w=10){ const wd=w*Math.sqrt(1-z*z); const raw=x=>1-Math.exp(-z*w*x)*(Math.cos(wd*x)+(z*w/wd)*Math.sin(wd*x)); const e=raw(1); return x=>x<=0?0:x>=1?1:raw(x)/e; }
function bezier(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=s=>((ax*s+bx)*s+cx)*s,Y=s=>((ay*s+by)*s+cy)*s,dX=s=>(3*ax*s+2*bx)*s+cx;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let s=x; for(let i=0;i<8;i++){const e=X(s)-x,d=dX(s); if(Math.abs(e)<1e-7||Math.abs(d)<1e-6)break; s-=e/d;}
    let lo=0,hi=1; if(Math.abs(X(s)-x)>1e-5){s=x; for(let i=0;i<40;i++){ if(X(s)<x)lo=s; else hi=s; s=(lo+hi)/2; }} return Y(s); };
}
const OUT=bezier(0.16,1,0.3,1), INOUT=bezier(0.65,0,0.35,1), POP=spring(0.55,12), PAINT=bezier(0.45,0,0.55,1);
const seg=(t,t0,d,e)=>e(clamp((t-t0)/d));
const lerp=(a,b,p)=>a+(b-a)*p;
const mix=(a,b,p)=>a.map((v,i)=>v+(b[i]-v)*p);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------------- timeline — paced to the VO ---------------- */
const T={ heroIn:-10, heroDur:2.4, paint:[0.25,1.7,3.0,4.2], paintDur:0.75,
  ticket:1.2, ticketWave:0.9, leave:1.75, leaveSpread:0.8, pins:4.0, pinSpread:0.8, bug:0.1, src:5.0 };

/* ================================================================
   THE LOT — real-world metres. x across, y into the lot, z up.
   ================================================================ */
const SW=2.7, SD=5.5, AISLE=7.2, COLS=98, ROWS=14, LAST=SPACES[0]-(ROWS-1)*COLS;   // 13 x 98 + 96 = 1370
const rowY0=r=>{ const p=Math.floor(r/2); return (p+1)*AISLE + p*2*SD + (r%2)*SD; };
const aisleOf=r=> r%2===0 ? Math.floor(r/2) : Math.floor(r/2)+1;
const aisleY=a=> a*(AISLE+2*SD)+AISLE/2;
const LOT_W=COLS*SW, LOT_D=rowY0(ROWS-1)+SD+AISLE;
const APRON_Y0=-60;
const PALETTE=[[232,232,228],[232,232,228],[40,42,46],[40,42,46],[96,100,106],[178,182,187],[178,182,187],[46,64,96],[132,42,40],[198,186,160],[80,106,142],[62,70,60]];
const stalls=[];
(function(){ const r=rng(42);
  for(let row=0;row<ROWS;row++){ const n=row===ROWS-1?LAST:COLS;
    for(let c=0;c<n;c++) stalls.push({row,c, x:(c+0.5)*SW, y:rowY0(row)+SD/2, h: row%2===0?0:Math.PI, aisle:aisleOf(row),
      color:PALETTE[Math.floor(r()*PALETTE.length)], suv:r()<0.3, jx:(r()-0.5)*0.25, jh:(r()-0.5)*0.04 }); }
})();
const HERO=stalls.findIndex(s=>s.row===0&&s.c===11);
const pick=(pool,n,seed)=>{ const r=rng(seed),a=pool.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); };
const FLAGGED=pick(stalls.map((_,i)=>i).filter(i=>i!==HERO),SPACES[1],7);
// which 62 of the 85 are canceled is illustrative; spread them along each aisle the way they would be in a real lot
const CANCELED=(()=>{ const out=[]; for(const minGap of [13,11,9,7,5,0]){ for(const i of pick(FLAGGED,FLAGGED.length,11)){ if(out.length===SPACES[2]) break; if(out.includes(i)) continue;
    const s=stalls[i]; if(out.every(j=>{ const o=stalls[j]; return aisleOf(o.row)!==aisleOf(s.row) || Math.abs(o.x-s.x)>=minGap; })) out.push(i); } if(out.length===SPACES[2]) break; } return out; })();
const REFERRED=pick(FLAGGED,SPACES[3],23);
FLAGGED.forEach(i=>{ const s=stalls[i]; s.flag=true; s.flagT=T.ticket+T.ticketWave*(s.x/LOT_W)+0.08*(s.row%3); });
// canceled cars back out and leave by the nearer end of their aisle
CANCELED.forEach(i=>{ const s=stalls[i]; s.cancel=true; s.jx=0; s.jh=0; s.dir = s.x < LOT_W/2 ? -1 : 1; s.toEnd = s.dir<0 ? s.x : LOT_W-s.x; });
CANCELED.forEach(i=>{ const s=stalls[i]; s.leaveT = T.leave + T.leaveSpread*(s.toEnd/(LOT_W/2)); });
REFERRED.slice().sort((a,b)=>stalls[a].x-stalls[b].x).forEach((i,k)=>{ const s=stalls[i]; s.refer=true; s.pinT=T.pins+T.pinSpread*k/(SPACES[3]-1); });

/* ---------------- departures: real car kinematics, no sideways slip ----------------
   A car pivots on its rear axle. It backs straight out, turns on a 3.5 m radius (rear axle),
   stops to shift, then pulls forward, easing back to the middle of the lane. Geometry was solved
   so the swinging nose clears the neighbouring cars (~0.29 m) and the row across the aisle. */
const KIN={ AX:-1.35, A:4.2, R:3.5, REV:3.2, PAUSE:0.35, ACC:2.4, VMAX:7.5, BLEND:11, R2:5.0 };
const FV=h=>[Math.sin(h),Math.cos(h)];
const fwdDist=v=> v<=0?0 : (v<KIN.VMAX/KIN.ACC ? 0.5*KIN.ACC*v*v : KIN.VMAX*KIN.VMAX/(2*KIN.ACC)+KIN.VMAX*(v-KIN.VMAX/KIN.ACC));
function obb(x,y,h,l=4.6,w=1.86){ const f=FV(h), r=[Math.cos(h),-Math.sin(h)];
  return [[l/2,w/2],[l/2,-w/2],[-l/2,-w/2],[-l/2,w/2]].map(([a,b])=>[x+f[0]*a+r[0]*b, y+f[1]*a+r[1]*b]); }
function sep(A,B){ let m=1e9; for(const P of [A,B]) for(let i=0;i<4;i++){ const a=P[i], b=P[(i+1)%4]; let n=[b[1]-a[1], a[0]-b[0]]; const l=Math.hypot(n[0],n[1]); n=[n[0]/l,n[1]/l];
  const pa=A.map(q=>q[0]*n[0]+q[1]*n[1]), pb=B.map(q=>q[0]*n[0]+q[1]*n[1]); m=Math.min(m, Math.min(Math.max(...pa)-Math.min(...pb), Math.max(...pb)-Math.min(...pa))); } return m; }  // >0 overlap
function departSetup(s){
  const h0=s.h, f0=FV(h0), exitH= s.dir>0 ? Math.PI/2 : -Math.PI/2;
  let d=exitH-h0; d=Math.atan2(Math.sin(d),Math.cos(d)); const sg=Math.sign(d);
  const a0=[s.x+f0[0]*KIN.AX, s.y+f0[1]*KIN.AX], aA=[a0[0]-f0[0]*KIN.A, a0[1]-f0[1]*KIN.A];
  const a1=[aA[0]+KIN.R*(Math.cos(exitH)-Math.cos(h0))/sg, aA[1]-KIN.R*(Math.sin(exitH)-Math.sin(h0))/sg];
  const xEnd= s.dir>0 ? LOT_W+6 : -6;
  s.k={h0,f0,sg,exitH,a0,aA,a1,xEnd,ay:aisleY(s.aisle),Lr:KIN.A+KIN.R*Math.PI/2,run:Math.abs(xEnd-a1[0])};
}
function axlePose(s,u){                    // rear-axle position + heading at u seconds after the car starts to move
  const k=s.k;
  if(u<=0) return {ax:k.a0, h:k.h0, ph:'park'};
  if(u<KIN.REV){ const sr=k.Lr*(1-Math.cos(Math.PI*u/KIN.REV))/2;
    if(sr<=KIN.A) return {ax:[k.a0[0]-k.f0[0]*sr, k.a0[1]-k.f0[1]*sr], h:k.h0, ph:'rev', u};
    const h=k.h0+k.sg*(sr-KIN.A)/KIN.R;
    return {ax:[k.aA[0]+KIN.R*(Math.cos(h)-Math.cos(k.h0))/k.sg, k.aA[1]-KIN.R*(Math.sin(h)-Math.sin(k.h0))/k.sg], h, ph:'rev', u}; }
  if(u<KIN.REV+KIN.PAUSE) return {ax:k.a1, h:k.exitH, ph:'stop'};
  const d=fwdDist(u-KIN.REV-KIN.PAUSE), dir=s.dir;
  if(d<k.run){ const B=Math.min(KIN.BLEND,k.run*0.85), q=clamp(d/B), sm=q*q*(3-2*q), dsm= q<1 ? 6*q*(1-q)/B : 0;
    return {ax:[k.a1[0]+dir*d, k.a1[1]+(k.ay-k.a1[1])*sm], h:Math.atan2(dir,(k.ay-k.a1[1])*dsm), ph:'go'}; }
  const R2=KIN.R2, arc=Math.PI/2*R2, e=d-k.run;
  if(e<arc){ const a=e/R2; return {ax:[k.xEnd+dir*R2*Math.sin(a), k.ay-R2*(1-Math.cos(a))], h:k.exitH+dir*a, ph:'go'}; }
  const y=k.ay-R2-(e-arc); if(y<-300) return null;
  return {ax:[k.xEnd+dir*R2, y], h:Math.PI, ph:'go'};
}
function departPose(s,t){
  const a=axlePose(s,t-s.leaveT); if(!a) return null;
  const f=FV(a.h); return { x:a.ax[0]-f[0]*KIN.AX, y:a.ax[1]-f[1]*KIN.AX, h:a.h, ph:a.ph, u:a.u };
}
const poseAt=(s,t)=> s.cancel ? departPose(s,t) : {x:s.x+s.jx, y:s.y, h:s.h+s.jh};
CANCELED.forEach(i=>departSetup(stalls[i]));
// schedule: the ticket lands first; then nobody pulls out into another car's path (they wait their turn)
(function(){ const order=CANCELED.map(i=>stalls[i]).sort((a,b)=>a.leaveT-b.leaveT), done=[];
  for(const s of order){ s.leaveT=Math.max(s.leaveT, s.flagT+0.7);
    for(let tries=0; tries<120; tries++){ let bad=false;
      for(let t=s.leaveT; t<DURATION+1 && !bad; t+=0.06){ const p=departPose(s,t); if(!p) break; const A=obb(p.x,p.y,p.h,4.6+1.0,1.86+0.5);
        for(const o of done){ const q=poseAt(o,t); if(!q || Math.abs(q.x-p.x)>8 || Math.abs(q.y-p.y)>8) continue; if(sep(A,obb(q.x,q.y,q.h))>0){ bad=true; break; } } }
      if(!bad) break; s.leaveT+=0.1; }
    done.push(s);
    // the moment the car has fully cleared its space (the space is then shown empty)
    const stall=obb(s.x,s.y,0,SD,SW); s.clearT=s.leaveT+KIN.REV;
    for(let u=0; u<KIN.REV; u+=0.02){ const p=departPose(s,s.leaveT+u); if(sep(obb(p.x,p.y,p.h),stall)<-0.05){ s.clearT=s.leaveT+u; break; } }
  } })();

/* ================================================================
   CAMERA — one continuous drone move (time-aware Catmull-Rom through keys)
   [t, x, y, z, yaw°, pitch°, focal]
   ================================================================ */
const KEYS=[
  [0.0,   94,  -50,  27,    -4, 33, 1000],   // on 137,016, the lot behind
  [2.4,  140,  -56,  31,     4, 35, 1000],   // drifting right onto 8,517
  [4.4,  138,  -82,  44,     0, 44,  960],   // easing back for the near row
  [5.6, 132.5, -90,  50,     0, 45,  900],   // final: all four figures, the lot behind
  [7.0, 132.5, -92,  51,     0, 45,  900],
];
/* the opening car comes along the front aisle and turns into its space */
function heroPose(t){
  const s=stalls[HERO], R=4.5, ay=aisleY(0), cx=s.x-R, cy=ay+R;
  const L1=22, L2=Math.PI/2*R, L3=s.y-cy, total=L1+L2+L3;
  const d=total*seg(t,T.heroIn,T.heroDur,bezier(0.2,0.45,0.25,1));
  if(d<L1) return {x:cx-L1+d, y:ay, h:Math.PI/2};
  if(d<L1+L2){ const ph=(d-L1)/R; return {x:cx+R*Math.sin(ph), y:cy-R*Math.cos(ph), h:Math.PI/2-ph}; }
  return {x:s.x, y:cy+(d-L1-L2), h:0};
}
function camAt(t){
  if(window.__camOverride) return camFrom(...window.__camOverride);
  const K=KEYS; let i=0; while(i<K.length-2 && t>K[i+1][0]) i++;
  const k0=K[Math.max(0,i-1)], k1=K[i], k2=K[i+1], k3=K[Math.min(K.length-1,i+2)];
  const h=k2[0]-k1[0], s=clamp((t-k1[0])/h);
  const tan=(a,b,c,j)=> (a===b||b===c) ? 0 : (c[j]-a[j])/(c[0]-a[0]);
  const out=[];
  for(let j=1;j<7;j++){
    const m1 = (i===0) ? 0 : (k2[j]-k0[j])/(k2[0]-k0[0]);
    const m2 = (i+1===K.length-1) ? 0 : (k3[j]-k1[j])/(k3[0]-k1[0]);
    const s2=s*s, s3=s2*s;
    out.push((2*s3-3*s2+1)*k1[j] + (s3-2*s2+s)*h*m1 + (-2*s3+3*s2)*k2[j] + (s3-s2)*h*m2);
  }
  return camFrom(...out);
}
function camFrom(x,y,z,yawD,pitchD,f){
  const yaw=yawD*Math.PI/180, pit=pitchD*Math.PI/180;
  const fw=[Math.sin(yaw)*Math.cos(pit), Math.cos(yaw)*Math.cos(pit), -Math.sin(pit)];
  const rt=[Math.cos(yaw), -Math.sin(yaw), 0];
  const up=[Math.sin(yaw)*Math.sin(pit), Math.cos(yaw)*Math.sin(pit), Math.cos(pit)];
  return {x,y,z,f,fw,rt,up,yaw,pit};
}
let CAM=null;
const NEAR=0.6;
function toCam(p){ const dx=p[0]-CAM.x, dy=p[1]-CAM.y, dz=(p[2]||0)-CAM.z;
  return [dx*CAM.rt[0]+dy*CAM.rt[1], dx*CAM.up[0]+dy*CAM.up[1]+dz*CAM.up[2], dx*CAM.fw[0]+dy*CAM.fw[1]+dz*CAM.fw[2]]; }
const scr=c=>[960+CAM.f*c[0]/c[2], 540-CAM.f*c[1]/c[2]];
function clipNear(pts){ const out=[]; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length];
    const ain=a[2]>NEAR, bin=b[2]>NEAR; if(ain) out.push(a);
    if(ain!==bin){ const k=(NEAR-a[2])/(b[2]-a[2]); out.push([a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, NEAR]); } } return out; }
const g=document.getElementById('world').getContext('2d');
function poly(pts3, fill){
  const c=clipNear(pts3.map(toCam)); if(c.length<3) return false;
  const s=c.map(scr);
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9; for(const p of s){ minx=Math.min(minx,p[0]); maxx=Math.max(maxx,p[0]); miny=Math.min(miny,p[1]); maxy=Math.max(maxy,p[1]); }
  if(maxx<-50||minx>1970||maxy<-50||miny>1130) return false;
  g.fillStyle=fill; g.beginPath(); g.moveTo(s[0][0],s[0][1]); for(let i=1;i<s.length;i++) g.lineTo(s[i][0],s[i][1]); g.closePath(); g.fill(); return true;
}
const rect=(x0,y0,x1,y1,z=0)=>[[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]];
const ringPts=(cx,cy,r,n=28,z=0)=>Array.from({length:n},(_,i)=>[cx+r*Math.cos(i/n*Math.PI*2), cy+r*Math.sin(i/n*Math.PI*2), z]);

/* ---------------- painted figures on the apron (textures, laid onto the ground) ---------------- */
const PPM=20, STW=64, STH=26;                      // stencil size in metres
const ST_POS=[[99,-18],[166,-18],[99,-46],[166,-46]];     // 2 x 2 block, read left-right, far row first
function makeStencil(st){
  const cv=document.createElement('canvas'); cv.width=STW*PPM; cv.height=STH*PPM; const c=cv.getContext('2d');
  c.fillStyle=rgb(st.paint); c.textAlign='center'; c.textBaseline='alphabetic';
  const fit=(txt,px,maxW)=>{ let s=px; c.font=`800 ${s}px GSign`; while(c.measureText(txt).width>maxW && s>10){ s-=2; c.font=`800 ${s}px GSign`; } };
  fit(st.value,270,cv.width-60); c.fillText(st.value,cv.width/2,232);
  st.label.forEach((l,i)=>{ fit(l,92,cv.width-60); c.fillText(l,cv.width/2,342+i*104); });
  if(st.key){ fit(st.key,56,cv.width-120); c.fillText(st.key,cv.width/2,452); }
  // worn paint: the asphalt shows through in places
  const r=rng(st.n); c.globalCompositeOperation='destination-out';
  for(let i=0;i<5200;i++){ c.fillStyle=`rgba(0,0,0,${0.35+r()*0.55})`; c.fillRect(r()*cv.width, r()*cv.height, 1+r()*3.5, 1+r()*2.5); }
  c.globalCompositeOperation='source-over';
  return cv;
}
let STENCILS=[], REVEAL=null;
function drawTexOnGround(tex, x0, yTop, wM, hM, reveal=1, nu=16, nv=6){
  const W=tex.width, H=tex.height;
  for(let j=0;j<nv;j++) for(let i=0;i<nu;i++){
    const v0=H*j/nv, v1=H*(j+1)/nv, umax=W*(typeof reveal==='function' ? reveal(v0) : reveal);
    const u0=W*i/nu; if(u0>=umax) continue; const u1=Math.min(W*(i+1)/nu, umax);
    const P=(u,v)=>{ const c=toCam([x0+u/W*wM, yTop-v/H*hM, 0.01]); return c; };
    const A=P(u0,v0),B=P(u1,v0),C=P(u1,v1),D=P(u0,v1);
    if(A[2]<NEAR||B[2]<NEAR||C[2]<NEAR||D[2]<NEAR) continue;
    const a=scr(A),b=scr(B),cc=scr(C),d=scr(D);
    const mnx=Math.min(a[0],b[0],cc[0],d[0]), mxx=Math.max(a[0],b[0],cc[0],d[0]), mny=Math.min(a[1],b[1],cc[1],d[1]), mxy=Math.max(a[1],b[1],cc[1],d[1]);
    if(mxx<0||mnx>1920||mxy<0||mny>1080) continue;
    for(const [t0,t1,t2,s0,s1,s2] of [[[u0,v0],[u1,v0],[u1,v1],a,b,cc],[[u0,v0],[u1,v1],[u0,v1],a,cc,d]]){
      const den=(t1[0]-t0[0])*(t2[1]-t0[1])-(t2[0]-t0[0])*(t1[1]-t0[1]); if(Math.abs(den)<1e-9) continue;
      const ma=((s1[0]-s0[0])*(t2[1]-t0[1])-(s2[0]-s0[0])*(t1[1]-t0[1]))/den, mc=((s2[0]-s0[0])*(t1[0]-t0[0])-(s1[0]-s0[0])*(t2[0]-t0[0]))/den;

  poly(top,'#D8D4C8'); poly(rect(x0+0.35,y0+0.35,x1-0.35,y1-0.35,k+0.01),'#5F7444');
  const r=rng(Math.floor(x0*7+y0*13)); for(let i=0;i<6;i++){ const cx=x0+0.9+r()*(x1-x0-1.8), cy=y0+0.9+r()*(y1-y0-1.8); poly(ringPts(cx,cy,0.45+r()*0.3,8,k+0.02), r()<0.5?'#6E8A4A':'#56703A'); }
}
let SUNSCR=[-0.6,-0.8];
function tree(T){
  if(T.kind==='palm') return palm(T);
  const {x,y,r}=T, base=toCam([x,y,0]); if(base[2]<NEAR+1) return;
  const a=scr(base), b=scr(toCam([x,y,r*1.4]));
  g.strokeStyle='#5A4636'; g.lineCap='round'; g.lineWidth=Math.max(1,CAM.f*0.38/base[2]); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
  const bl=T.blobs.map(([dx,dy,z,rr])=>({c:toCam([x+dx,y+dy,z]),rr})).filter(q=>q.c[2]>NEAR).sort((p,q)=>q.c[2]-p.c[2]);
  const hue=T.tone;
  for(const q of bl){ const s=scr(q.c), R=CAM.f*q.rr/q.c[2]; if(R<0.6) continue;
    const hx=s[0]+SUNSCR[0]*R*0.38, hy=s[1]+SUNSCR[1]*R*0.38, gr=g.createRadialGradient(hx,hy,R*0.08,s[0],s[1],R*1.02);
    gr.addColorStop(0, hue<0.5?'#8DAE5E':'#97B163'); gr.addColorStop(0.5, hue<0.5?'#5E8240':'#668443'); gr.addColorStop(1, hue<0.5?'#2F4A22':'#354E24');
    g.fillStyle=gr; g.beginPath(); g.arc(s[0],s[1],R,0,Math.PI*2); g.fill(); }
}
function palm(T){
  const {x,y,h,lean}=T, base=toCam([x,y,0]); if(base[2]<NEAR+1) return;
  const pts=[]; for(let i=0;i<=8;i++){ const q=i/8, c=toCam([x+lean[0]*q*q, y+lean[1]*q*q, h*q]); if(c[2]<NEAR) return; pts.push(scr(c)); }
  const w0=CAM.f*0.36/base[2];
  for(let i=0;i<8;i++){ g.strokeStyle= i%2?'#8C7C66':'#7F705B'; g.lineWidth=Math.max(0.8,w0*(1-i/8*0.45)); g.lineCap='round'; g.beginPath(); g.moveTo(pts[i][0],pts[i][1]); g.lineTo(pts[i+1][0],pts[i+1][1]); g.stroke(); }
  const cr=[x+lean[0], y+lean[1], h];
  const fr=T.fr.map(([a,L,dr])=>{ const sp=[]; for(let k=0;k<=6;k++){ const d=L*k/6; sp.push(toCam([cr[0]+Math.cos(a)*d, cr[1]+Math.sin(a)*d, cr[2]+0.35*d-dr*d*d])); } return sp; }).filter(sp=>sp.every(c=>c[2]>NEAR));
  fr.sort((p,q)=>q[6][2]-p[6][2]);
  for(const sp of fr){ const S=sp.map(scr), W=sp.map((c,k)=>CAM.f*0.42*Math.sin(Math.PI*Math.min(0.98,k/6+0.08))/c[2]);
    const L=[],Rr=[]; for(let k=0;k<S.length;k++){ const a=S[Math.max(0,k-1)], b=S[Math.min(S.length-1,k+1)]; let nx=-(b[1]-a[1]), ny=b[0]-a[0]; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l; L.push([S[k][0]+nx*W[k],S[k][1]+ny*W[k]]); Rr.push([S[k][0]-nx*W[k],S[k][1]-ny*W[k]]); }
    g.fillStyle='#4C6B31'; g.beginPath(); g.moveTo(L[0][0],L[0][1]); for(const p of L) g.lineTo(p[0],p[1]); for(const p of Rr.reverse()) g.lineTo(p[0],p[1]); g.closePath(); g.fill();
    g.strokeStyle='#7A9952'; g.lineWidth=Math.max(0.5,W[2]*0.35); g.beginPath(); g.moveTo(S[0][0],S[0][1]); for(const p of S) g.lineTo(p[0],p[1]); g.stroke(); }
  const c=toCam(cr); if(c[2]>NEAR){ const s=scr(c); g.fillStyle='#5B5139'; g.beginPath(); g.arc(s[0],s[1],Math.max(1,CAM.f*0.35/c[2]),0,Math.PI*2); g.fill(); }
}
function pole(x,y){
  const a=toCam([x,y,0]); if(a[2]<NEAR+1) return;
  const bs=frustum(x,y,0,[-0.32,0.32,0.32],[-0.28,0.28,0.28],0,0.7); bs.sides.forEach(F=>{ const n=faceN(F); if(facing(F,n)) poly(F,rgb([190,185,174].map(v=>v*shadeK(n)))); }); poly(bs.top,'#C9C4B8');
  const p0=toCam([x,y,0.7]), p1=toCam([x,y,10.2]); if(p0[2]<NEAR||p1[2]<NEAR) return; const A=scr(p0),B=scr(p1);
  const w=Math.max(1,CAM.f*0.2/p0[2]); g.lineCap='butt'; g.strokeStyle='#6F747A'; g.lineWidth=w; g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke();
  g.strokeStyle='#A3A8AE'; g.lineWidth=Math.max(0.5,w*0.35); g.beginPath(); g.moveTo(A[0]-w*0.2,A[1]); g.lineTo(B[0]-w*0.2,B[1]); g.stroke();
  for(const sg of [-1,1]){ const e=toCam([x+sg*1.5,y,10.2]); if(e[2]<NEAR) continue; const E=scr(e); g.strokeStyle='#6F747A'; g.lineWidth=Math.max(0.8,w*0.6); g.beginPath(); g.moveTo(B[0],B[1]); g.lineTo(E[0],E[1]); g.stroke();
    const hd=frustum(x+sg*1.75,y,Math.PI/2,[-0.45,0.45,0.22],[-0.42,0.42,0.2],10.05,10.25); hd.sides.forEach(F=>{ const n=faceN(F); if(facing(F,n)) poly(F,'#3A3D41'); }); poly(hd.top,'#4A4E53'); }
}
function poleShadow(x,y){ const L=10.2, ex=x+SHX*L, ey=y+SHY*L, nx=-(ey-y), ny=ex-x, l=Math.hypot(nx,ny), w=0.11;
  poly([[x+nx/l*w,y+ny/l*w,0.012],[ex+nx/l*w,ey+ny/l*w,0.012],[ex-nx/l*w,ey-ny/l*w,0.012],[x-nx/l*w,y-ny/l*w,0.012]],'rgba(8,10,14,.22)'); }
function pin(x,y,zb,t){                      // sheriff's badge marker standing over a referred space
  const a=toCam([x,y,zb]), b=toCam([x,y,zb+3.4]); if(a[2]<NEAR+1||b[2]<NEAR) return;
  const A=scr(a), B=scr(b), R=CAM.f*1.25/b[2];
  g.strokeStyle='#3A2F17'; g.lineWidth=Math.max(1.2,CAM.f*0.14/a[2]); g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke();
  g.fillStyle='#8C6A24'; g.beginPath(); g.arc(B[0],B[1],R*1.08,0,Math.PI*2); g.fill();
  g.fillStyle='#D9B04A'; g.beginPath(); g.arc(B[0],B[1],R,0,Math.PI*2); g.fill();
  g.fillStyle='#FFF3CF'; g.beginPath(); for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=i%2?R*0.32:R*0.72; g.lineTo(B[0]+rr*Math.cos(ang),B[1]+rr*Math.sin(ang)); } g.closePath(); g.fill();
}

function render(t){
  CAM=camAt(t);
  g.setTransform(2,0,0,2,0,0);
  const sk=g.createLinearGradient(0,0,0,1080); sk.addColorStop(0,'#9DBAD3'); sk.addColorStop(1,'#D9E0DF'); g.fillStyle=sk; g.fillRect(0,0,1920,1080);
  drawGround(t);
  // shadows
  const poses=[];
  for(const [i,s] of stalls.entries()){
    let x=s.x+s.jx, y=s.y, h=s.h+s.jh;
    if(i===HERO){ const hp=heroPose(t); x=hp.x; y=hp.y; h=hp.h; }
    let st=null;
    if(s.cancel){ const d=departPose(s,t); if(!d) continue; x=d.x; y=d.y; h=d.h; st=d; }
    poses.push({i,s,x,y,h,st});
  }
  for(const p of poses) carShadow(p.x,p.y,p.h,p.s.suv?1.7:1.45);
  for(const T of TREES){ const hh=T.kind==='palm'?T.h:T.r*1.9, rr=T.kind==='palm'?2.4:T.r*1.05; poly(ringPts(T.x+SHX*hh+(T.lean?T.lean[0]:0),T.y+SHY*hh+(T.lean?T.lean[1]:0),rr,16,0.01),'rgba(8,10,14,.24)'); }
  for(const [x,y] of POLES) poleShadow(x,y);
  { const c0=toCam([LOT_W/2,LOT_D/2,0]), c1=toCam([LOT_W/2+SUNN[0]*10,LOT_D/2+SUNN[1]*10,SUNN[2]*10]); if(c0[2]>NEAR&&c1[2]>NEAR){ const a=scr(c0),b=scr(c1); const l=Math.hypot(b[0]-a[0],b[1]-a[1])||1; SUNSCR=[(b[0]-a[0])/l,(b[1]-a[1])/l]; } }
  LIGHTS.length=0;
  // objects, far to near
  const items=[];
  for(const p of poses) items.push({d:toCam([p.x,p.y,1])[2], fn:()=>{ const s=p.s, mute= s.flag?0:seg(t,T.ticket-0.3,1.0,INOUT); const st=p.st, rev=!!st&&st.ph==='rev', brake=!!s.cancel && ((t>s.leaveT-0.5 && t<s.leaveT) || (rev && st.u>KIN.REV*0.55) || (st&&st.ph==='stop'));
    car(p.x,p.y,p.h,s.color,{suv:s.suv,mute,ticket:s.flag?POP(clamp((t-s.flagT)/0.45)):0,rev,brake}); }});
  for(const T of TREES) items.push({d:toCam([T.x,T.y,T.kind==='palm'?T.h*0.5:T.r])[2], fn:()=>tree(T)});
  for(const [x,y] of POLES) items.push({d:toCam([x,y,5])[2], fn:()=>pole(x,y)});
  for(const s of stalls) if(s.refer && t>s.pinT){ const p=clamp((t-s.pinT)/0.7), zb=lerp(26,1.6,POP(p)); poly(ringPts(s.x+SHX*(zb+3.4),s.y+SHY*(zb+3.4),1.1,14,0.02),'rgba(8,10,14,.22)'); items.push({d:toCam([s.x,s.y,zb+2])[2]-3, fn:()=>pin(s.x,s.y,zb,t)}); }
  items.sort((a,b)=>b.d-a.d); for(const it of items) if(it.d>NEAR) it.fn();
  // red/blue lights pulse around the referred spaces once marked; brake / reverse lamps glow
  g.save(); g.globalCompositeOperation='lighter';
  for(const [p1,p2,col,a] of LIGHTS) for(const P3 of [p1,p2]){ const c=toCam(P3); if(c[2]<NEAR) continue; const p=scr(c), R=CAM.f*0.55/c[2]; if(R<1) continue;
    const gg=g.createRadialGradient(p[0],p[1],0,p[0],p[1],R); gg.addColorStop(0,rgb(col,a)); gg.addColorStop(1,rgb(col,0)); g.fillStyle=gg; g.fillRect(p[0]-R,p[1]-R,2*R,2*R); }
  for(const s of stalls) if(s.refer && t>s.pinT+0.4){ const c=toCam([s.x,s.y,1.5]); if(c[2]<NEAR) continue; const p=scr(c), R=CAM.f*5.5/c[2], ph=Math.floor(t*4+s.c)%2;
    const gg=g.createRadialGradient(p[0],p[1],0,p[0],p[1],R); const col=ph?[232,57,46]:[47,107,255]; gg.addColorStop(0,rgb(col,0.32)); gg.addColorStop(1,rgb(col,0)); g.fillStyle=gg; g.fillRect(p[0]-R,p[1]-R,2*R,2*R); }
  g.restore();
  // drifting cloud shadows
  for(const [cx,cy,r] of CLOUDS){ const x=cx+t*2.2; for(const [k,a] of [[1,0.025],[0.8,0.025],[0.6,0.025]]) poly(ringPts(x,cy,r*k,24,0.02),`rgba(20,26,34,${a})`); }
  // overlay type
  rise(document.querySelector('#bug .eyebrow > span'),t,T.bug); rise(document.querySelector('#bug .title > span'),t,T.bug+0.12);
  document.querySelectorAll('#src .mask > span').forEach((e,i)=>rise(e,t,T.src+i*0.12));
}
function rise(el,t,t0,d=1.0){ el.style.transform=`translateY(${(1-seg(t,t0,d,OUT))*140}%)`; }

window.ready=(async()=>{
  await Promise.all([document.fonts.load('800 100px GSign'),document.fonts.load('600 44px GSerif'),document.fonts.load('600 17px GText'),document.fonts.load('500 18px GText')]);
  await document.fonts.ready;
  STENCILS=STATS.map(makeStencil); ISA=makeISA(); render(0); return true;
})();
window.render=render;
window.__data={KIN,axlePose,obb,sep,poseAt,STATS,SPACES,stalls,FLAGGED,CANCELED,REFERRED,HERO,T,DURATION,KEYS,camAt,departPose,LOT_W,LOT_D,ST_POS,STW,STH,toCam:(p)=>toCam(p),scr:(c)=>scr(c)};
const q=new URLSearchParams(location.search);
if(!q.has('capture')) window.ready.then(()=>{ if(q.has('t')){render(+q.get('t'));return;} const t0=performance.now(); const loop=n=>{render(((n-t0)/1000)%(DURATION+1)); requestAnimationFrame(loop);}; requestAnimationFrame(loop); });
</script>
